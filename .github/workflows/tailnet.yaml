name: Sync Tailscale ACLs

on:
  push:
    branches: [ "master" ]
    paths: [ "sdwan/**" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "sdwan/**" ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Tailnet ACL
        if: github.event_name == 'push'
        id: tailnet-deploy
        uses: tailscale/gitops-acl-action@v1
        with:
          policy-file: sdwan/olympians.hujson
          api-key: ${{ secrets.TS_API_KEY }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply

      - name: Test Tailnet ACL
        if: github.event_name == 'pull_request'
        id: tailnet-test
        uses: tailscale/gitops-acl-action@v1
        with:
          policy-file: sdwan/olympians.hujson
          api-key: ${{ secrets.TS_API_KEY }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test

